<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>투두리스트</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      background: #fff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      padding: 28px;
      height: fit-content;
    }

    h1 {
      font-size: 26px;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    #todo-input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    #todo-input:focus { border-color: #667eea; }

    #add-btn {
      padding: 12px 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #add-btn:hover { opacity: 0.85; }

    .filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .filters button {
      flex: 1;
      padding: 8px 0;
      border: 1px solid #e0e0e0;
      background: #fff;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
    }

    .filters button.active {
      background: #667eea;
      border-color: #667eea;
      color: #fff;
      font-weight: 600;
    }

    #todo-list { list-style: none; }

    #todo-list li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 10px;
      border-bottom: 1px solid #f0f0f0;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #todo-list li.done .text {
      text-decoration: line-through;
      color: #aaa;
    }

    .text { flex: 1; font-size: 15px; color: #333; word-break: break-all; }

    .del-btn {
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 18px;
      cursor: pointer;
      opacity: 0.6;
      padding: 4px 8px;
    }

    .del-btn:hover { opacity: 1; }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
      cursor: pointer;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 13px;
      color: #888;
    }

    #clear-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }

    #clear-btn:hover { color: #e74c3c; }

    .empty {
      text-align: center;
      color: #bbb;
      padding: 30px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>📝 투두리스트</h1>

    <div class="input-row">
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요..." autofocus />
      <button id="add-btn">추가</button>
    </div>

    <div class="filters">
      <button data-filter="all" class="active">전체</button>
      <button data-filter="active">진행 중</button>
      <button data-filter="done">완료</button>
    </div>

    <ul id="todo-list"></ul>

    <div class="footer">
      <span id="count"></span>
      <button id="clear-btn">완료 항목 삭제</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "todos";
    let todos = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let filter = "all";

    const input = document.getElementById("todo-input");
    const listEl = document.getElementById("todo-list");
    const countEl = document.getElementById("count");

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function render() {
      const visible = todos.filter(t =>
        filter === "all" ? true : filter === "done" ? t.done : !t.done
      );

      listEl.innerHTML = "";
      if (visible.length === 0) {
        const li = document.createElement("li");
        li.innerHTML = '<div class="empty">할 일이 없습니다 ✨</div>';
        listEl.appendChild(li);
      }

      visible.forEach(t => {
        const li = document.createElement("li");
        if (t.done) li.classList.add("done");

        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = t.done;
        cb.addEventListener("change", () => toggle(t.id));

        const span = document.createElement("span");
        span.className = "text";
        span.textContent = t.text;

        const del = document.createElement("button");
        del.className = "del-btn";
        del.textContent = "✕";
        del.addEventListener("click", () => remove(t.id));

        li.append(cb, span, del);
        listEl.appendChild(li);
      });

      const activeCount = todos.filter(t => !t.done).length;
      countEl.textContent = `남은 할 일: ${activeCount}개`;
    }

    function add() {
      const text = input.value.trim();
      if (!text) return;
      todos.push({ id: Date.now(), text, done: false });
      input.value = "";
      save();
      render();
    }

    function toggle(id) {
      const t = todos.find(t => t.id === id);
      if (t) t.done = !t.done;
      save();
      render();
    }

    function remove(id) {
      todos = todos.filter(t => t.id !== id);
      save();
      render();
    }

    document.getElementById("add-btn").addEventListener("click", add);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") add();
    });

    document.querySelectorAll(".filters button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelector(".filters .active").classList.remove("active");
        btn.classList.add("active");
        filter = btn.dataset.filter;
        render();
      });
    });

    document.getElementById("clear-btn").addEventListener("click", () => {
      todos = todos.filter(t => !t.done);
      save();
      render();
    });

    render();
  </script>
</body>
</html>
